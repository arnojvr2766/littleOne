<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<script>/* relative paths need a trailing slash when served under a sub-path */if(!location.pathname.endsWith('/')&&!/\.[a-z]+$/.test(location.pathname))location.replace(location.pathname+'/'+location.search+location.hash)</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f8f2">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LittleOne">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>LittleOne</title>
<meta name="description" content="Our shared baby planner.">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="appbar">
  <a href="#home" class="brand" aria-label="LittleOne home"><img src="assets/logo-mark.png" alt="" width="34" height="34"><span>LittleOne</span></a>
  <nav class="toptabs" aria-label="Sections" id="toptabs"></nav>
  <button class="iconbtn" id="menu" aria-label="Settings and app info"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><i class="syncdot" id="syncdot"></i></button>
</header>
<main id="view"></main>
<button class="fab hidden" id="fab" aria-label="Add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabbar" aria-label="Sections" id="tabbar"></nav>
<div class="updatebar hidden" id="updatebar" role="status"><span>A new version of LittleOne is ready.</span><button id="applyUpdate">Update</button></div>
<dialog id="dialog"><div class="sheetHandle" aria-hidden="true"></div><div class="dialogTop"><strong id="dialogLabel"></strong><button id="close" aria-label="Close">×</button></div><div id="dialogBody" class="dialogBody"></div></dialog>
<div role="status" id="notice"></div>
<script src="version.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
